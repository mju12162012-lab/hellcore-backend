applications:
  hellcore:
    # Environment runtime runtime version
    type: "nodejs:20"

    # Build optimization settings
    build:
      flavor: none

    # Global runtime package dependencies
    dependencies:
      nodejs:
        npm: "*"

    # Web process boot commands
    web:
      commands:
        start: "node server.js"

    # Disk storage allocation for temporary runtime files (in MB)
    disk: 512

    # Ephemeral storage mounts
    mounts:
      "/tmp":
        source: storage
        source_path: "tmp"
routes:
  # 1. Primary non-www domain serving your application upstream
  "https://{default}/":
    type: upstream
    upstream: "myapp:http"

  # 2. Redirect rule from www to non-www domain
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
